<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta name="description" content="曼朗心之旅 - 专业心理咨询服务平台，提供在线心理健康评估与咨询服务" />
    <meta name="keywords" content="曼朗,心之旅,mindtrip,emojump,心理咨询,心理健康,在线咨询,心理评估,心理测试" />
    <meta name="author" content="曼朗科技" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=0"
    />
    <!-- 由 vite 注入 VITE_APP_TITLE 变量，在 .env 文件内配置 -->
    <title><%= VITE_APP_TITLE %></title>
    <link rel="icon" href="/favicon.ico" />
    
    <!-- 预连接到关键域名以加快DNS查找和TLS握手 -->
    <link rel="dns-prefetch" href="https://hm.baidu.com">
    <link rel="preconnect" href="https://hm.baidu.com" crossorigin>
    
    <!-- 延迟加载百度统计，避免阻塞首屏渲染 -->
    <script>
      // 使用 requestIdleCallback 在浏览器空闲时加载百度统计
      (function() {
        var HM_ID = '<%= VITE_APP_BAIDU_CODE %>';
        if (!HM_ID) return;
        
        window._hmt = window._hmt || [];
        
        function loadBaiduAnalytics() {
          var hm = document.createElement('script');
          hm.src = 'https://hm.baidu.com/hm.js?' + HM_ID;
          hm.async = true;
          hm.defer = true;
          document.head.appendChild(hm);
        }
        
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadBaiduAnalytics, { timeout: 3000 });
        } else {
          // Fallback for browsers that don't support requestIdleCallback
          setTimeout(loadBaiduAnalytics, 2000);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
